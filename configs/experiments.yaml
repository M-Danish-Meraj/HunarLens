# HunarLens — Partitioning, Cross-Validation, Hyperparameter Search & Evaluation Policy
# Reference: PROJECT_PLAN.md §6, §9, §10, §11

seeds:
  test_split: 42                   # GroupShuffleSplit (~15% test holdout from full cohort)
  val_split: 43                    # GroupShuffleSplit (~15/85 of remaining -> ~15% overall validation)
  cv_folds: 44                     # StratifiedGroupKFold(n_splits=5) inside training
  model_training: 42               # Estimator & search random_state
  permutation_importance: 45       # Validation permutation importance seed
  bootstrap_ci: 46                 # 1,000-resample PSU-clustered bootstrap on frozen test set

splits:
  group_column: "PCode"            # PSU-disjoint partitioning keeping all households together
  test_size: 0.15
  val_size_of_remaining: 0.17647   # 0.15 / 0.85 = ~15.0% of total dataset
  cv_n_splits: 5

metrics:
  primary_headline: "f1_pos"       # F1 score for positive class (is_unemployed == 1)
  search_refit_metric: "average_precision"
  tracked_metrics:
    - "f1_pos"
    - "average_precision"
    - "precision_pos"
    - "recall_pos"
    - "roc_auc"
    - "brier_score"

threshold_policy:
  grid_min: 0.01
  grid_max: 0.99
  grid_step: 0.01
  include_endpoints: true          # Also evaluate 0.0 and 1.0 endpoints (§10.2)
  selection_criterion: "f1_pos"
  tie_breakers:
    - "recall_pos"
    - "higher_threshold"
  winner_f1_tolerance: 0.01        # If top validation F1 within 0.01, prefer higher validation AP, then simpler model (§9.2)

models:
  dummy_prior:
    strategy: "prior"
  dummy_all_positive:
    strategy: "constant"
    constant: 1

  logistic_regression:
    search_type: "grid"
    max_iter: 1000
    solver: "lbfgs"
    param_grid:
      classifier__C: [0.01, 0.1, 1.0, 10.0]
      classifier__class_weight: [null, "balanced"]

  random_forest:
    search_type: "random"
    n_iter: 20
    param_distributions:
      classifier__n_estimators: [200, 400]
      classifier__max_depth: [5, 10, 20, null]
      classifier__min_samples_leaf: [2, 5, 10, 20]
      classifier__max_features: ["sqrt", 0.7]
      classifier__class_weight: [null, "balanced_subsample"]

  gradient_boosting:
    search_type: "random"
    n_iter: 20
    # Disable internal ungrouped early stopping split (§9.1)
    fixed_params:
      n_iter_no_change: null
    param_distributions:
      classifier__n_estimators: [100, 200, 300]
      classifier__learning_rate: [0.03, 0.05, 0.1]
      classifier__max_depth: [1, 2, 3]
      classifier__min_samples_leaf: [5, 10, 20]
      classifier__subsample: [0.8, 1.0]

ablations:
  # Preplanned training-CV ablations (§9.2)
  - name: "demographics_only_no_census"
    drop_features:
      - "regional_pop_density_log1p"
      - "regional_urban_share"
      - "regional_avg_household_size"
  - name: "demographics_plus_census_no_sex"
    drop_features:
      - "sex"

evaluation:
  bootstrap_resamples: 1000
  confidence_level: 0.95
  permutation_repeats: 10
  artifacts:
    pipeline_path: "models/final_pipeline.joblib"
    metadata_path: "models/model_metadata.json"
    threshold_path: "models/decision_threshold.json"
    schema_path: "models/feature_schema.json"
    freeze_manifest_path: "models/freeze_manifest.json"
